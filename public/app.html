<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timeline Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    /* Warm paper ground, slightly cool-biased neutrals toward the indigo accent */
    --paper:        #F7F6F3;
    --paper-2:      #FFFFFF;
    --surface:      #FFFFFF;
    --surface-2:    #FBFAF8;
    --line:         #E4E2DC;
    --line-2:       #D3D0C8;

    --ink:          #23211E;
    --ink-2:        #5C5852;
    --ink-3:        #7D7871;

    --indigo:       #4F46B8;
    --indigo-soft:  #EDEBF8;
    --indigo-line:  #C9C4EC;

    --plum:         #8B5CA8;
    --plum-soft:    #F3EBF7;
    --plum-line:    #DFCBE9;

    --moss:         #4E7A4A;
    --moss-soft:    #EAF1E8;
    --moss-line:    #C8DCC4;

    --ochre:        #A8792B;
    --ochre-soft:   #F8F0DE;
    --ochre-line:   #E8D5A8;

    --clay:         #B0503F;
    --clay-soft:    #FAEBE8;
    --clay-line:    #EFCCC5;

    --font-display: 'Fraunces', Georgia, serif;
    --font-ui:      'Inter', system-ui, sans-serif;
    --font-mono:    'JetBrains Mono', ui-monospace, monospace;

    --r-sm: 6px; --r-md: 10px; --r-lg: 16px;
    --t: 150ms cubic-bezier(0.4,0,0.2,1);
    --shadow-1: 0 1px 2px rgba(35,33,30,0.05);
    --shadow-2: 0 2px 8px rgba(35,33,30,0.07), 0 1px 2px rgba(35,33,30,0.04);
    --shadow-3: 0 12px 32px rgba(35,33,30,0.12), 0 2px 8px rgba(35,33,30,0.06);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-ui);
    font-size: 14px;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* Soft paper texture wash */
  body::before {
    content: '';
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(1200px 600px at 12% -10%, rgba(79,70,184,0.05), transparent 60%),
      radial-gradient(1000px 500px at 88% 110%, rgba(139,92,168,0.045), transparent 60%);
  }

  .app { position: relative; z-index: 1; display: flex; flex-direction: column; height: 100vh; }

  /* ── TOPBAR ───────────────────────── */
  .topbar {
    flex-shrink: 0; height: 56px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 22px;
    background: rgba(255,255,255,0.82);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--line);
  }
  .topbar-left { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .topbar-brand { display: flex; align-items: baseline; gap: 9px; }
  .topbar-title {
    font-family: var(--font-display);
    font-size: 17px; font-weight: 600; letter-spacing: -0.015em;
    color: var(--ink); white-space: nowrap;
  }
  .topbar-sub { font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); white-space: nowrap; }

  /* Timeline tabs */
  .timeline-tabs {
    display: flex; align-items: center; gap: 2px;
    background: var(--surface-2); border: 1px solid var(--line);
    border-radius: var(--r-md); padding: 3px; min-width: 0;
  }
  .timeline-tab {
    padding: 4px 12px; border-radius: 7px;
    font-family: var(--font-ui); font-size: 12px; font-weight: 500;
    cursor: pointer; border: none; background: transparent; color: var(--ink-2);
    transition: var(--t); white-space: nowrap;
    max-width: 160px; overflow: hidden; text-overflow: ellipsis;
  }
  .timeline-tab.active { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-1); font-weight: 600; }
  .timeline-tab:hover:not(.active) { background: rgba(35,33,30,0.04); color: var(--ink); }
  .timeline-tab-add {
    width: 26px; height: 26px; border-radius: 7px; border: none;
    background: transparent; color: var(--ink-3); font-size: 17px; line-height: 1;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: var(--t); flex-shrink: 0;
  }
  .timeline-tab-add:hover { background: var(--indigo-soft); color: var(--indigo); }

  .topbar-right { display: flex; align-items: center; gap: 7px; }
  .save-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--line-2); transition: background 300ms; flex-shrink: 0; }
  .save-dot.saving { background: var(--ochre); }
  .save-dot.saved  { background: var(--moss); }

  .btn {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 6px 13px; border-radius: var(--r-sm);
    font-family: var(--font-ui); font-size: 12px; font-weight: 500;
    cursor: pointer; border: 1px solid transparent; transition: var(--t); white-space: nowrap;
  }
  .btn-ghost { background: var(--surface); color: var(--ink-2); border-color: var(--line); box-shadow: var(--shadow-1); }
  .btn-ghost:hover { background: var(--surface-2); color: var(--ink); border-color: var(--line-2); }
  .btn-danger { background: var(--clay-soft); color: var(--clay); border-color: var(--clay-line); }
  .btn-danger:hover { background: #F6DFDA; }
  .btn-danger-solid { background: var(--clay); color: #fff; border-color: var(--clay); box-shadow: var(--shadow-1); }
  .btn-danger-solid:hover { background: #9A4536; }
  .btn-primary { background: var(--indigo); color: #fff; box-shadow: var(--shadow-1); }
  .btn-primary:hover { background: #5B52C7; }

  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

  /* ── TIMELINE RAIL ────────────────── */
  .timeline-stage {
    position: relative;
    flex-shrink: 0; height: 132px;
    overflow-x: auto; overflow-y: visible;
    background: linear-gradient(180deg, rgba(255,255,255,0.7), rgba(255,255,255,0.35));
    border-bottom: 1px solid var(--line);
    scrollbar-width: none;
  }
  .timeline-stage::-webkit-scrollbar { display: none; }
  .timeline-inner {
    position: relative; height: 100%; min-width: max-content;
    padding: 0 80px; display: flex; align-items: flex-start;
  }
  /* Rail is pinned to the dot row (dot: 13px tall, starting at 34px) */
  .timeline-rail {
    position: absolute; top: 40px; left: 0; right: 0;
    height: 2px; pointer-events: none;
    background: linear-gradient(90deg,
      transparent 0%,
      var(--line-2) 7%,
      var(--line-2) 93%,
      transparent 100%);
    border-radius: 2px;
  }

  /* ── DATE NODE (one per calendar date) ── */
  .date-spacing { width: 268px; display: flex; justify-content: center; flex-shrink: 0; }

  .date-node {
    position: relative; z-index: 10; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 11px;
    padding-top: 34px;
  }
  /* Label sits below the rail on an opaque plate so the rule never crosses the text */
  .date-label-plate {
    background: var(--paper);
    border-radius: 8px;
    padding: 3px 8px;
  }

  .date-dot {
    width: 13px; height: 13px; border-radius: 50%;
    border: 2px solid var(--line-2);
    background: var(--paper-2);
    transition: var(--t);
    box-shadow: 0 0 0 3px rgba(255,255,255,0.9);
  }
  .date-node:hover .date-dot { border-color: var(--indigo); background: var(--indigo-soft); }

  .date-node.today .date-dot {
    border-color: var(--indigo); background: var(--indigo);
    box-shadow: 0 0 0 3px var(--indigo-soft), 0 0 0 5px rgba(255,255,255,0.9);
    animation: pulse 2.6s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { box-shadow: 0 0 0 3px var(--indigo-soft), 0 0 0 5px rgba(255,255,255,0.9); }
    50%      { box-shadow: 0 0 0 6px var(--indigo-soft), 0 0 0 8px rgba(255,255,255,0.9); }
  }
  .date-node.selected .date-dot {
    border-color: var(--plum); background: var(--plum);
    box-shadow: 0 0 0 3px var(--plum-soft), 0 0 0 5px rgba(255,255,255,0.9);
    animation: none;
  }

  .date-label { text-align: center; user-select: none; max-width: 210px; }
  .date-text {
    font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-3);
    letter-spacing: 0.04em; margin-bottom: 3px;
  }
  .date-names {
    font-family: var(--font-display);
    font-size: 13px; font-weight: 600; color: var(--ink-2);
    transition: var(--t); line-height: 1.25;
    display: flex; flex-direction: column; align-items: center; gap: 1px;
  }
  .date-node:hover .date-names, .date-node.selected .date-names { color: var(--ink); }
  .date-name-row { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
  .date-count {
    font-family: var(--font-ui); font-size: 10px; font-weight: 500;
    color: var(--indigo); background: var(--indigo-soft);
    border: 1px solid var(--indigo-line);
    padding: 1px 6px; border-radius: 20px; margin-top: 3px; display: inline-block;
  }
  .today-badge {
    font-family: var(--font-ui);
    font-size: 8.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em;
    background: var(--indigo); color: #fff; padding: 2px 6px; border-radius: 3px;
    position: absolute; top: 8px; left: 50%; transform: translateX(-50%); white-space: nowrap;
  }

  /* ── CARDS AREA ───────────────────── */
  .cards-area { flex: 1; overflow: auto; padding: 22px 0 40px; scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; align-content: start; }
  .cards-area::-webkit-scrollbar { width: 8px; height: 8px; }
  .cards-area::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 4px; border: 2px solid var(--paper); }
  .cards-viewport { display: flex; min-width: max-content; padding: 0 80px; align-items: flex-start; }

  /* One column per DATE; holds stacked milestone groups */
  .date-col { width: 268px; flex-shrink: 0; display: flex; flex-direction: column; gap: 14px; padding: 0 10px; transition: opacity var(--t); }
  .date-col.dimmed { opacity: 0.32; }

  /* ── MILESTONE GROUP (stacked within a date) ── */
  .ms-group {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-2);
    overflow: hidden;
    transition: box-shadow var(--t), border-color var(--t);
  }
  .ms-group:hover { box-shadow: var(--shadow-3); border-color: var(--line-2); }
  .ms-group.is-selected { border-color: var(--plum-line); box-shadow: 0 0 0 3px var(--plum-soft), var(--shadow-3); }

  .ms-group-head {
    display: flex; align-items: flex-start; gap: 8px;
    padding: 10px 12px;
    background: var(--surface-2);
    border-bottom: 1px solid var(--line);
    cursor: pointer; user-select: none;
  }
  .ms-group-title {
    flex: 1; min-width: 0;
    font-family: var(--font-display); font-size: 13.5px; font-weight: 600; color: var(--ink);
    line-height: 1.3; overflow-wrap: anywhere; text-wrap: balance;
  }
  .ms-group-badge {
    font-size: 9.5px; font-weight: 600; padding: 2px 7px; border-radius: 20px;
    background: var(--indigo-soft); color: var(--indigo); border: 1px solid var(--indigo-line);
    white-space: nowrap; flex-shrink: 0;
  }
  .ms-group-del {
    width: 20px; height: 20px; border: none; background: transparent;
    color: var(--ink-3); cursor: pointer; border-radius: 4px; font-size: 13px; line-height: 1;
    display: flex; align-items: center; justify-content: center; transition: var(--t); flex-shrink: 0;
  }
  .ms-group-del:hover { background: var(--clay-soft); color: var(--clay); }

  .ms-group-body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 8px; }

  .col-label {
    font-family: var(--font-ui);
    font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em;
    color: var(--ink-3); display: flex; align-items: center; gap: 7px;
  }
  .col-label::after { content:''; flex:1; height:1px; background: var(--line); }

  .add-btn {
    display: flex; align-items: center; gap: 6px; padding: 6px 10px;
    border-radius: var(--r-sm); border: 1px dashed var(--line-2);
    background: transparent; color: var(--ink-3); font-family: var(--font-ui);
    font-size: 11px; cursor: pointer; transition: var(--t); width: 100%;
  }
  .add-btn:hover { border-color: var(--indigo); color: var(--indigo); background: var(--indigo-soft); border-style: solid; }

  /* ── CARD ─────────────────────────── */
  .card {
    background: var(--paper-2);
    border: 1px solid var(--line);
    border-left: 3px solid var(--line-2);
    border-radius: var(--r-md);
    overflow: hidden;
    transition: var(--t);
  }
  .card:hover { border-color: var(--line-2); box-shadow: var(--shadow-1); }
  .card-type-idea { border-left-color: var(--plum);  background: linear-gradient(180deg, var(--plum-soft), var(--paper-2) 42%); }
  .card-type-task { border-left-color: var(--indigo); background: linear-gradient(180deg, var(--indigo-soft), var(--paper-2) 42%); }
  .card-type-note { border-left-color: var(--ochre); background: linear-gradient(180deg, var(--ochre-soft), var(--paper-2) 42%); }
  .card-type-risk { border-left-color: var(--clay);  background: linear-gradient(180deg, var(--clay-soft), var(--paper-2) 42%); }

  .card-header { display: flex; align-items: center; gap: 8px; padding: 9px 11px; cursor: pointer; user-select: none; }
  .card-title { flex: 1; min-width: 0; font-size: 12.5px; font-weight: 500; color: var(--ink); line-height: 1.35; }
  .card-count { font-family: var(--font-mono); font-size: 10px; color: var(--ink-3); margin-left: 4px; }
  .card-chevron { width: 14px; height: 14px; color: var(--ink-3); transition: transform var(--t); flex-shrink: 0; }
  .card-chevron svg { width: 100%; height: 100%; display: block; }
  .card.collapsed .card-chevron { transform: rotate(-90deg); }

  .card-body { overflow: hidden; transition: max-height 240ms cubic-bezier(0.4,0,0.2,1), opacity 180ms ease; max-height: 600px; }
  .card.collapsed .card-body { max-height: 0; opacity: 0; }
  .card-body-inner { padding: 9px 11px 11px; border-top: 1px solid var(--line); }
  .card-desc { font-size: 12px; color: var(--ink-2); line-height: 1.6; margin-bottom: 9px; }

  .checklist { list-style: none; display: flex; flex-direction: column; gap: 6px; }
  .checklist-item { display: flex; align-items: flex-start; gap: 8px; font-size: 11.5px; color: var(--ink-2); line-height: 1.45; }
  .checklist-item input[type="checkbox"] { width: 13px; height: 13px; accent-color: var(--indigo); flex-shrink: 0; margin-top: 1px; cursor: pointer; }
  .checklist-item.done span { text-decoration: line-through; color: var(--ink-3); }

  .card-tag { display: inline-flex; align-items: center; gap: 4px; margin-top: 9px; font-size: 9.5px; font-weight: 600; padding: 2px 8px; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.05em; }
  .tag-idea { background: var(--plum-soft);   color: var(--plum);   border: 1px solid var(--plum-line); }
  .tag-task { background: var(--indigo-soft); color: var(--indigo); border: 1px solid var(--indigo-line); }
  .tag-note { background: var(--ochre-soft);  color: var(--ochre);  border: 1px solid var(--ochre-line); }
  .tag-risk { background: var(--clay-soft);   color: var(--clay);   border: 1px solid var(--clay-line); }
  .empty-hint { font-size: 11px; color: var(--ink-3); font-style: italic; }

  /* Empty state */
  .empty-state {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; padding: 70px 30px; width: 100%; text-align: center;
  }
  .empty-state-title { font-family: var(--font-display); font-size: 19px; font-weight: 600; color: var(--ink-2); }
  .empty-state-desc { font-size: 13px; color: var(--ink-3); max-width: 340px; line-height: 1.6; }

  /* ── MODAL ────────────────────────── */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(35,33,30,0.28); backdrop-filter: blur(5px);
    z-index: 200; display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity 170ms ease;
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  .modal {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg);
    width: 410px; max-width: 90vw; box-shadow: 0 24px 64px rgba(35,33,30,0.22);
    transform: translateY(10px) scale(0.985); transition: transform 170ms ease;
  }
  .modal-overlay.open .modal { transform: translateY(0) scale(1); }
  .modal-header { padding: 17px 19px 13px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .modal-title { font-family: var(--font-display); font-size: 15px; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .modal-close { width: 26px; height: 26px; background: transparent; border: none; color: var(--ink-3); cursor: pointer; border-radius: var(--r-sm); font-size: 19px; line-height: 1; display: flex; align-items: center; justify-content: center; transition: var(--t); flex-shrink: 0; }
  .modal-close:hover { background: var(--surface-2); color: var(--ink); }
  .modal-body { padding: 17px 19px; display: flex; flex-direction: column; gap: 13px; }
  .form-group { display: flex; flex-direction: column; gap: 5px; }
  .form-label { font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.09em; color: var(--ink-3); }
  .form-hint { font-size: 11px; color: var(--ink-3); line-height: 1.45; }
  .form-input, .form-select, .form-textarea {
    background: var(--surface-2); border: 1px solid var(--line-2); border-radius: var(--r-sm);
    padding: 8px 11px; color: var(--ink); font-family: var(--font-ui); font-size: 13px;
    outline: none; transition: var(--t); width: 100%;
  }
  .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--indigo); box-shadow: 0 0 0 3px var(--indigo-soft); background: var(--surface); }
  .form-textarea { resize: vertical; min-height: 74px; line-height: 1.55; }
  .modal-footer { padding: 13px 19px; border-top: 1px solid var(--line); display: flex; gap: 7px; justify-content: flex-end; background: var(--surface-2); border-radius: 0 0 var(--r-lg) var(--r-lg); }

  /* Confirm */
  .confirm-box {
    background: var(--surface); border: 1px solid var(--clay-line); border-radius: var(--r-lg);
    padding: 26px; width: 350px; max-width: 90vw; text-align: center;
    box-shadow: 0 24px 64px rgba(35,33,30,0.22);
    transform: translateY(10px) scale(0.985); transition: transform 170ms ease;
  }
  .modal-overlay.open .confirm-box { transform: translateY(0) scale(1); }
  .confirm-icon { font-size: 26px; margin-bottom: 10px; }
  .confirm-title { font-family: var(--font-display); font-size: 16px; font-weight: 600; margin-bottom: 7px; }
  .confirm-desc { font-size: 12.5px; color: var(--ink-2); margin-bottom: 20px; line-height: 1.55; }
  .confirm-actions { display: flex; gap: 8px; justify-content: center; }

  @media (prefers-reduced-motion: reduce) {
    .date-node.today .date-dot { animation: none; }
    *, *::before, *::after { transition: none !important; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="topbar-left">
      <div class="topbar-brand">
        <span class="topbar-title">Timeline Planner</span>
        <span class="topbar-sub" id="topbar-sub"></span>
      </div>
      <div class="timeline-tabs" id="timeline-tabs"></div>
    </div>
    <div class="topbar-right">
      <div class="save-dot" id="save-dot" title="Saved"></div>
      <button class="btn btn-ghost" onclick="toggleAll(false)">Expand</button>
      <button class="btn btn-ghost" onclick="toggleAll(true)">Collapse</button>
      <button class="btn btn-danger" onclick="openConfirmClear()">Clear</button>
      <button class="btn btn-primary" onclick="openAddMilestone()">＋ Milestone</button>
    </div>
  </header>

  <div class="main">
    <div class="timeline-stage" id="timeline-stage">
      <div class="timeline-inner" id="timeline-inner">
        <div class="timeline-rail"></div>
      </div>
    </div>
    <div class="cards-area" id="cards-area">
      <div class="cards-viewport" id="cards-viewport"></div>
    </div>
  </div>
</div>

<!-- Add Card Modal -->
<div class="modal-overlay" id="card-modal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="card-modal-title">Add item</span>
      <button class="modal-close" onclick="closeCardModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="form-group"><label class="form-label">Title</label><input class="form-input" id="card-title" placeholder="Short, clear title…"></div>
      <div class="form-group"><label class="form-label">Type</label>
        <select class="form-select" id="card-type">
          <option value="idea">Idea</option>
          <option value="task">Task</option>
          <option value="note">Note</option>
          <option value="risk">Risk</option>
        </select>
      </div>
      <div class="form-group"><label class="form-label">Description</label><textarea class="form-textarea" id="card-desc" placeholder="Optional detail…"></textarea></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeCardModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveCard()">Add item</button>
    </div>
  </div>
</div>

<!-- Add Milestone Modal -->
<div class="modal-overlay" id="ms-modal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">New Milestone</span>
      <button class="modal-close" onclick="closeMsModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="form-group"><label class="form-label">Name</label><input class="form-input" id="ms-name" placeholder="e.g. Beta Launch"></div>
      <div class="form-group">
        <label class="form-label">Date</label>
        <input class="form-input" id="ms-date" type="date">
        <span class="form-hint">Reuse a date that already exists to stack this milestone beneath it as a parallel track.</span>
      </div>
      <div class="form-group"><label class="form-label">Label (optional)</label><input class="form-input" id="ms-label" placeholder="e.g. v2.0"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeMsModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveMilestone()">Add milestone</button>
    </div>
  </div>
</div>

<!-- New Timeline Modal -->
<div class="modal-overlay" id="tl-modal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">New Timeline</span>
      <button class="modal-close" onclick="closeTlModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="form-group"><label class="form-label">Timeline name</label><input class="form-input" id="tl-name" placeholder="e.g. Q1 2027, Product Roadmap…"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeTlModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveTimeline()">Create timeline</button>
    </div>
  </div>
</div>

<!-- Confirm Modal -->
<div class="modal-overlay" id="confirm-modal">
  <div class="confirm-box">
    <div class="confirm-icon">⚠️</div>
    <div class="confirm-title" id="confirm-title">Clear this timeline?</div>
    <div class="confirm-desc" id="confirm-desc">All milestones and cards will be permanently deleted.</div>
    <div class="confirm-actions">
      <button class="btn btn-ghost" onclick="closeConfirm()">Cancel</button>
      <button class="btn btn-danger-solid" id="confirm-ok-btn" onclick="confirmOk()">Delete everything</button>
    </div>
  </div>
</div>

<script>
/* ── State ──────────────────────────── */
let boards = {};
let activeBoard = null;
let selectedDate = null;     // selection is now per-DATE, not per-milestone
let currentMsId = null;
let confirmCallback = null;
let saveTimer = null;

const TODAY = new Date().toISOString().slice(0,10);

/* ── API ────────────────────────────── */
async function loadAll() {
  try {
    const r = await fetch('/api/board');
    const d = await r.json();
    if (d.boards) {
      boards = d.boards;
      activeBoard = d.activeBoard && d.boards[d.activeBoard] ? d.activeBoard : Object.keys(d.boards)[0];
    } else {
      const id = 'board-default';
      boards = { [id]: { name: 'My Timeline', milestones: d.milestones || [] } };
      activeBoard = id;
    }
    if (!activeBoard) { boards = { 'board-default': { name: 'My Timeline', milestones: [] } }; activeBoard = 'board-default'; }
  } catch (e) {
    boards = { 'board-default': { name: 'My Timeline', milestones: [] } };
    activeBoard = 'board-default';
  }
  render();
}

function scheduleSave() {
  const dot = document.getElementById('save-dot');
  if (dot) { dot.className = 'save-dot saving'; dot.title = 'Saving…'; }
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try {
      await fetch('/api/board', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ boards, activeBoard })
      });
      if (dot) { dot.className = 'save-dot saved'; dot.title = 'All changes saved'; }
      setTimeout(() => { if (dot) dot.className = 'save-dot'; }, 1800);
    } catch { if (dot) { dot.className = 'save-dot'; dot.title = 'Save failed'; } }
  }, 650);
}

function currentBoard() { return boards[activeBoard] || { name:'', milestones:[] }; }

/* Group milestones by date → [{date, items:[ms,...]}], sorted */
function groupedByDate() {
  const map = new Map();
  for (const ms of currentBoard().milestones) {
    if (!map.has(ms.date)) map.set(ms.date, []);
    map.get(ms.date).push(ms);
  }
  return [...map.entries()]
    .sort((a,b) => a[0].localeCompare(b[0]))
    .map(([date, items]) => ({ date, items }));
}

/* ── Render ─────────────────────────── */
function render() { renderTabs(); renderTimeline(); renderCards(); updateSub(); }

function renderTabs() {
  const c = document.getElementById('timeline-tabs');
  c.innerHTML = '';
  Object.entries(boards).forEach(([id, b]) => {
    const btn = document.createElement('button');
    btn.className = 'timeline-tab' + (id === activeBoard ? ' active' : '');
    btn.textContent = b.name;
    btn.title = b.name;
    btn.onclick = () => switchBoard(id);
    c.appendChild(btn);
  });
  const add = document.createElement('button');
  add.className = 'timeline-tab-add';
  add.title = 'New timeline';
  add.textContent = '+';
  add.onclick = openTlModal;
  c.appendChild(add);
}

function renderTimeline() {
  const inner = document.getElementById('timeline-inner');
  inner.innerHTML = '<div class="timeline-rail"></div>';
  groupedByDate().forEach(group => {
    const isToday = group.date === TODAY;
    const isSel = group.date === selectedDate;
    const wrap = document.createElement('div');
    wrap.className = 'date-spacing';

    const node = document.createElement('div');
    node.className = 'date-node' + (isToday ? ' today' : '') + (isSel ? ' selected' : '');
    node.onclick = () => selectDate(group.date);

    const names = group.items.slice(0, 2)
      .map(m => `<div class="date-name-row">${esc(m.name)}</div>`).join('');
    const more = group.items.length > 2 ? `<div class="date-name-row" style="color:var(--ink-3);font-weight:500">+${group.items.length - 2} more</div>` : '';
    const countPill = group.items.length > 1
      ? `<span class="date-count">${group.items.length} tracks</span>` : '';

    node.innerHTML = `
      ${isToday ? '<span class="today-badge">Today</span>' : ''}
      <div class="date-dot"></div>
      <div class="date-label-plate">
        <div class="date-label">
          <div class="date-text">${fmtDate(group.date)}</div>
          <div class="date-names">${names}${more}</div>
          ${countPill}
        </div>
      </div>`;
    wrap.appendChild(node);
    inner.appendChild(wrap);
  });
}

function renderCards() {
  const vp = document.getElementById('cards-viewport');
  vp.innerHTML = '';
  const groups = groupedByDate();

  if (!groups.length) {
    vp.innerHTML = `
      <div class="empty-state">
        <div class="empty-state-title">Nothing on this timeline yet</div>
        <div class="empty-state-desc">Add a milestone to get started. Give two milestones the same date and they'll stack as parallel tracks on that point of the timeline.</div>
      </div>`;
    return;
  }

  groups.forEach(group => {
    const isDimmed = selectedDate && group.date !== selectedDate;
    const col = document.createElement('div');
    col.className = 'date-col' + (isDimmed ? ' dimmed' : '');
    col.setAttribute('data-date', group.date);

    group.items.forEach(ms => {
      col.appendChild(buildMsGroup(ms, group.date));
    });

    vp.appendChild(col);
  });
}

function buildMsGroup(ms, date) {
  const box = document.createElement('div');
  box.className = 'ms-group' + (date === selectedDate ? ' is-selected' : '');
  box.setAttribute('data-ms-id', ms.id);

  const head = document.createElement('div');
  head.className = 'ms-group-head';
  head.onclick = (e) => { if (!e.target.closest('.ms-group-del')) selectDate(date); };
  head.innerHTML = `
    <span class="ms-group-title">${esc(ms.name)}</span>
    ${ms.label ? `<span class="ms-group-badge">${esc(ms.label)}</span>` : ''}
    <button class="ms-group-del" title="Delete milestone" onclick="deleteMilestone('${ms.id}')">✕</button>`;
  box.appendChild(head);

  const body = document.createElement('div');
  body.className = 'ms-group-body';

  const ideas = ms.cards.filter(c => c.type === 'idea');
  const tasks = ms.cards.filter(c => c.type !== 'idea');

  if (ideas.length) {
    const l = document.createElement('div'); l.className = 'col-label'; l.textContent = 'Ideas';
    body.appendChild(l);
    ideas.forEach(c => body.appendChild(buildCard(c, ms.id)));
  }
  const addIdea = document.createElement('button');
  addIdea.className = 'add-btn';
  addIdea.textContent = '＋ idea';
  addIdea.onclick = () => openAddCard(ms.id, 'idea');
  body.appendChild(addIdea);

  if (tasks.length) {
    const l = document.createElement('div'); l.className = 'col-label'; l.textContent = 'Tasks & Notes';
    body.appendChild(l);
    tasks.forEach(c => body.appendChild(buildCard(c, ms.id)));
  }
  const addTask = document.createElement('button');
  addTask.className = 'add-btn';
  addTask.textContent = '＋ task / note';
  addTask.onclick = () => openAddCard(ms.id, 'task');
  body.appendChild(addTask);

  box.appendChild(body);
  return box;
}

function buildCard(card, msId) {
  const el = document.createElement('div');
  el.className = `card card-type-${card.type}${card.collapsed ? ' collapsed' : ''}`;
  el.setAttribute('data-card-id', card.id);

  const hasTasks = card.tasks?.length > 0;
  const done = hasTasks ? card.tasks.filter(t => t.done).length : 0;
  const countHtml = hasTasks ? `<span class="card-count">${done}/${card.tasks.length}</span>` : '';

  let body = '';
  if (card.desc) body += `<p class="card-desc">${esc(card.desc)}</p>`;
  if (hasTasks) {
    body += '<ul class="checklist">';
    card.tasks.forEach((t, ti) => {
      body += `<li class="checklist-item${t.done ? ' done' : ''}"><input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleTask('${card.id}',${ti},'${msId}',this.checked)"><span>${esc(t.text)}</span></li>`;
    });
    body += '</ul>';
  }
  if (!card.desc && !hasTasks) body += `<span class="empty-hint">No detail yet.</span>`;

  el.innerHTML = `
    <div class="card-header" onclick="toggleCard('${card.id}','${msId}')">
      <span class="card-title">${esc(card.title)}${countHtml}</span>
      <span class="card-chevron"><svg viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    </div>
    <div class="card-body"><div class="card-body-inner">
      ${body}
      <span class="card-tag tag-${card.type}">${card.type}</span>
    </div></div>`;
  return el;
}

function updateSub() {
  const el = document.getElementById('topbar-sub');
  if (!el) return;
  const g = groupedByDate();
  if (!g.length) { el.textContent = ''; return; }
  const fmt = s => new Date(s+'T12:00:00').toLocaleDateString('en-GB',{month:'short',year:'numeric'});
  el.textContent = `${fmt(g[0].date)} → ${fmt(g[g.length-1].date)}`;
}

/* ── Selection (per date) ───────────── */
function findMs(id) { return currentBoard().milestones.find(m => m.id === id); }

function selectDate(date) {
  const msOnDate = currentBoard().milestones.filter(m => m.date === date);
  if (!msOnDate.length) return;

  if (selectedDate === date) {
    selectedDate = null;
    msOnDate.forEach(ms => ms.cards.forEach(c => c.collapsed = true));
  } else {
    if (selectedDate) {
      currentBoard().milestones
        .filter(m => m.date === selectedDate)
        .forEach(ms => ms.cards.forEach(c => c.collapsed = true));
    }
    selectedDate = date;
    msOnDate.forEach(ms => ms.cards.forEach(c => c.collapsed = false));
  }
  render();
  if (selectedDate) {
    setTimeout(() => {
      document.querySelector(`#cards-viewport [data-date="${date}"]`)
        ?.scrollIntoView({ behavior:'smooth', inline:'center', block:'nearest' });
    }, 40);
  }
  scheduleSave();
}

/* ── Card interactions ──────────────── */
function toggleCard(cardId, msId) {
  const card = findMs(msId)?.cards.find(c => c.id === cardId);
  if (!card) return;
  card.collapsed = !card.collapsed;
  document.querySelector(`[data-card-id="${cardId}"]`)?.classList.toggle('collapsed', card.collapsed);
  scheduleSave();
}

function toggleAll(collapse) {
  currentBoard().milestones.forEach(ms => ms.cards.forEach(c => c.collapsed = collapse));
  selectedDate = null;
  render();
  scheduleSave();
}

function toggleTask(cardId, ti, msId, checked) {
  const card = findMs(msId)?.cards.find(c => c.id === cardId);
  if (!card) return;
  card.tasks[ti].done = checked;
  const titleEl = document.querySelector(`[data-card-id="${cardId}"] .card-title`);
  if (titleEl) {
    const d = card.tasks.filter(t => t.done).length;
    titleEl.innerHTML = `${esc(card.title)}<span class="card-count">${d}/${card.tasks.length}</span>`;
  }
  document.querySelectorAll(`[data-card-id="${cardId}"] .checklist-item`)[ti]?.classList.toggle('done', checked);
  scheduleSave();
}

/* ── Add card ───────────────────────── */
function openAddCard(msId, type='idea') {
  currentMsId = msId;
  const ms = findMs(msId);
  document.getElementById('card-modal-title').textContent = `Add to "${ms?.name ?? ''}"`;
  document.getElementById('card-title').value = '';
  document.getElementById('card-desc').value = '';
  document.getElementById('card-type').value = type;
  document.getElementById('card-modal').classList.add('open');
  setTimeout(() => document.getElementById('card-title').focus(), 50);
}
function closeCardModal() { document.getElementById('card-modal').classList.remove('open'); currentMsId = null; }
function saveCard() {
  const title = document.getElementById('card-title').value.trim();
  if (!title) { document.getElementById('card-title').focus(); return; }
  const ms = findMs(currentMsId);
  if (!ms) return;
  ms.cards.push({
    id: 'c' + Date.now(),
    type: document.getElementById('card-type').value,
    title,
    desc: document.getElementById('card-desc').value.trim(),
    tasks: [], collapsed: false
  });
  closeCardModal(); render(); scheduleSave();
}

/* ── Add / delete milestone ─────────── */
function openAddMilestone() {
  document.getElementById('ms-date').value = selectedDate || TODAY;
  document.getElementById('ms-name').value = '';
  document.getElementById('ms-label').value = '';
  document.getElementById('ms-modal').classList.add('open');
  setTimeout(() => document.getElementById('ms-name').focus(), 50);
}
function closeMsModal() { document.getElementById('ms-modal').classList.remove('open'); }
function saveMilestone() {
  const name = document.getElementById('ms-name').value.trim();
  if (!name) { document.getElementById('ms-name').focus(); return; }
  const date = document.getElementById('ms-date').value || TODAY;
  currentBoard().milestones.push({
    id: 'm' + Date.now() + Math.random().toString(36).slice(2,6),
    name, date,
    label: document.getElementById('ms-label').value.trim(),
    cards: []
  });
  closeMsModal(); render(); scheduleSave();
}

function deleteMilestone(msId) {
  const ms = findMs(msId);
  if (!ms) return;
  document.getElementById('confirm-title').textContent = `Delete "${ms.name}"?`;
  document.getElementById('confirm-desc').textContent = 'This milestone and all of its ideas and tasks will be removed.';
  document.getElementById('confirm-ok-btn').textContent = 'Delete milestone';
  confirmCallback = () => {
    const b = currentBoard();
    b.milestones = b.milestones.filter(m => m.id !== msId);
    if (!b.milestones.some(m => m.date === selectedDate)) selectedDate = null;
    render(); scheduleSave();
  };
  document.getElementById('confirm-modal').classList.add('open');
}

/* ── Timelines ──────────────────────── */
function switchBoard(id) { activeBoard = id; selectedDate = null; render(); scheduleSave(); }
function openTlModal() {
  document.getElementById('tl-name').value = '';
  document.getElementById('tl-modal').classList.add('open');
  setTimeout(() => document.getElementById('tl-name').focus(), 50);
}
function closeTlModal() { document.getElementById('tl-modal').classList.remove('open'); }
function saveTimeline() {
  const name = document.getElementById('tl-name').value.trim();
  if (!name) { document.getElementById('tl-name').focus(); return; }
  const id = 'board-' + Date.now();
  boards[id] = { name, milestones: [] };
  activeBoard = id; selectedDate = null;
  closeTlModal(); render(); scheduleSave();
}

/* ── Clear / confirm ────────────────── */
function openConfirmClear() {
  document.getElementById('confirm-title').textContent = `Clear "${currentBoard().name}"?`;
  document.getElementById('confirm-desc').textContent = 'All milestones and cards on this timeline will be permanently deleted.';
  document.getElementById('confirm-ok-btn').textContent = 'Delete everything';
  confirmCallback = () => {
    boards[activeBoard].milestones = [];
    selectedDate = null;
    render(); scheduleSave();
  };
  document.getElementById('confirm-modal').classList.add('open');
}
function closeConfirm() { document.getElementById('confirm-modal').classList.remove('open'); confirmCallback = null; }
function confirmOk() { const cb = confirmCallback; closeConfirm(); cb?.(); }

/* ── Scroll sync ────────────────────── */
function syncScroll() {
  const stage = document.getElementById('timeline-stage');
  const area  = document.getElementById('cards-area');
  const inner = document.getElementById('timeline-inner');
  const vp    = document.getElementById('cards-viewport');
  let sl = false, cl = false;
  stage.addEventListener('scroll', () => {
    if (cl) return; sl = true;
    const r = stage.scrollLeft / (inner.scrollWidth - stage.clientWidth || 1);
    area.scrollLeft = r * (vp.scrollWidth - area.clientWidth);
    requestAnimationFrame(() => sl = false);
  });
  area.addEventListener('scroll', () => {
    if (sl) return; cl = true;
    const r = area.scrollLeft / (vp.scrollWidth - area.clientWidth || 1);
    stage.scrollLeft = r * (inner.scrollWidth - stage.clientWidth);
    requestAnimationFrame(() => cl = false);
  });
}

/* ── Keyboard / overlay dismiss ─────── */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeCardModal(); closeMsModal(); closeTlModal(); closeConfirm(); }
});
['card-modal','ms-modal','tl-modal','confirm-modal'].forEach(id => {
  document.getElementById(id).addEventListener('click', e => {
    if (e.target === e.currentTarget) { closeCardModal(); closeMsModal(); closeTlModal(); closeConfirm(); }
  });
});

/* ── Utils ──────────────────────────── */
function fmtDate(s) { return new Date(s+'T12:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'2-digit'}); }
function esc(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* ── Init ───────────────────────────── */
loadAll();
syncScroll();
</script>
</body>
</html>
